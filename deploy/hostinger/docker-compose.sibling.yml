# Second staging copy at /opt/cns-line-oa (Admin under /cloudnex-connect/admin/test).
# Same image tag as primary. Operator-owned .env — copy from primary, do not commit.
# Own Redis so BullMQ keys do not collide with the primary stack.
# Do not point the same LINE OA webhook at this process unless it has distinct
# LINE_CHANNEL_* credentials. HMAC /webhook* stays on primary 8080 by default.
services:
  redis:
    image: redis:7-alpine
    container_name: cns-line-oa-staging-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    environment:
      TZ: Asia/Bangkok
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8
    volumes:
      - /usr/share/zoneinfo/Asia/Bangkok:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro

  cns-line-oa:
    image: ${DOCKER_IMAGE:-razenjazzy/cloudnex-connect:staging}
    pull_policy: always
    container_name: cns-line-oa-staging
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - /opt/cns-line-oa/.env
    environment:
      APP_ENV: staging
      NODE_ENV: production
      PORT: "8080"
      PUBLIC_BASE_URL: https://amardhaka.io/cloudnex-connect
      PUBLIC_ADMIN_BASE: /cloudnex-connect/admin/test
      ENABLE_DEMO_CONTROL_PANEL: "false"
      ENABLE_WEBHOOK_TEST: "false"
      ENABLE_GRAPHQL: "true"
      ENABLE_API_DOCS: "true"
      CLAWFRAMEWORK_ENABLED: "false"
      REDIS_URL: redis://redis:6379
      LINE_WEBHOOK_ASYNC: "true"
      OPS_JOBS_ASYNC: "false"
      RUN_BULLMQ_WORKER: "true"
      MONGO_VECTOR_ENABLED: "false"
      RATE_LIMIT_STORE: memory
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /usr/share/zoneinfo/Asia/Bangkok:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
