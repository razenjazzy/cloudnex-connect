# Host pino / Docker json-file logs. Install as
# /etc/logrotate.d/cloudnex-connect (root). Hourly via crontab.example.
# 30-day gzip retain. copytruncate so the container keeps the same fd.

/var/lib/docker/containers/*/*-json.log {
  hourly
  rotate 720
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  maxage 30
}

/opt/cloudnex-connect/logs/*.log {
  daily
  rotate 30
  compress
  delaycompress
  missingok
  notifempty
  copytruncate
  maxage 30
}
