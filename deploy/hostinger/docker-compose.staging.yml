# Staging on Hostinger VPS. Env file is on the server only — never commit secrets.
# Runtime image is pulled from Docker Hub (built on laptop/CI). The VPS does not npm ci.
# `environment:` overrides .env so LINE async cannot stay false while Redis is in this file.
services:
  redis:
    image: redis:7-alpine
    container_name: cloudnex-connect-staging-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    environment:
      TZ: Asia/Bangkok
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8
    volumes:
      - /usr/share/zoneinfo/Asia/Bangkok:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    # No host ports — LINE queue only.

  cloudnex-connect:
    image: ${DOCKER_IMAGE:-razenjazzy/cloudnex-connect:staging}
    pull_policy: always
    container_name: cloudnex-connect-staging
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - /opt/cloudnex-connect/.env
    environment:
      APP_ENV: staging
      NODE_ENV: production
      PORT: "8080"
      PUBLIC_BASE_URL: https://amardhaka.io/cloudnex-connect
      PUBLIC_ADMIN_BASE: /admin
      PUBLIC_DEMO_BASE: /demo
      ENABLE_DEMO_CONTROL_PANEL: "true"
      ENABLE_WEBHOOK_TEST: "true"
      ENABLE_GRAPHQL: "true"
      ENABLE_API_DOCS: "true"
      CLAWFRAMEWORK_ENABLED: "false"
      REDIS_URL: redis://redis:6379
      LINE_WEBHOOK_ASYNC: "true"
      OPS_JOBS_ASYNC: "false"
      RUN_BULLMQ_WORKER: "true"
      MONGO_VECTOR_ENABLED: "false"
      RATE_LIMIT_STORE: memory
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /usr/share/zoneinfo/Asia/Bangkok:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
