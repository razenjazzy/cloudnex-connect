# Staging deploy to amardhaka.io (Hostinger VPS).
# Out of scope: new npm packages, second LINE router, GraphQL LINE events,
# Mongo for users, admin-chain changes, other vhosts, committing VPS secrets.
# Server .env stays on the box. GitHub secret VPS_SSH_KEY is the SSH key only.
# Image: build linux/amd64 and push razenjazzy/cloudnex-connect:staging; VPS pulls.
# Job runs only when repository variable ENABLE_STAGING_VPS_DEPLOY is the string true.
name: staging-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-vps
  cancel-in-progress: true

# Do not gate on secrets.* in job if — GitHub treats that as an invalid workflow
# (failed run with zero jobs). Opt in with a repository variable instead.
jobs:
  deploy:
    name: Deploy amardhaka.io
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ vars.ENABLE_STAGING_VPS_DEPLOY == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Push image and pull on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DOCKER_IMAGE: razenjazzy/cloudnex-connect:staging
        run: bash ./scripts/deploy-cloudnex-connect-staging.sh

      - name: Public health
        run: curl -fsS https://amardhaka.io/healthz

      - name: Staging live gate
        run: bash ./scripts/validate-staging.sh https://amardhaka.io
