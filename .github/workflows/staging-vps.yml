# Staging deploy to amardhaka.io (Hostinger VPS).
# Out of scope: new npm packages, second LINE router, GraphQL LINE events,
# Mongo for users, admin-chain changes, other vhosts, committing VPS secrets.
# Server .env stays on the box. GitHub secret VPS_SSH_KEY is the SSH key only.
# Image: build linux/amd64 and push razenjazzy/cloudnex-connect:staging; VPS pulls
# (deploy-vps-lane.sh SSH-loads the image if Hub push is denied).
# Job always runs (green when opt-in is off). VPS mutate only when
# ENABLE_STAGING_VPS_DEPLOY is the string true.
name: staging-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-vps
  cancel-in-progress: true

# Do not gate on secrets.* in job if — GitHub treats that as an invalid workflow
# (failed run with zero jobs). Do not skip the job; that shows as Skipped.
jobs:
  deploy:
    name: Deploy amardhaka.io
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Opt-in gate
        id: gate
        env:
          ENABLE_STAGING_VPS_DEPLOY: ${{ vars.ENABLE_STAGING_VPS_DEPLOY }}
        run: |
          if [ "$ENABLE_STAGING_VPS_DEPLOY" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ENABLE_STAGING_VPS_DEPLOY=true — deploying sibling :8081"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ENABLE_STAGING_VPS_DEPLOY is not true — no VPS mutate (success)."
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup SSH
        if: steps.gate.outputs.run == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Push image and pull on VPS
        if: steps.gate.outputs.run == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_REMOTE_DIR: /opt/cns-line-oa
          DOCKER_IMAGE: razenjazzy/cloudnex-connect:staging
        run: bash ./scripts/deploy-vps-lane.sh staging

      - name: Public health (HMAC host + staging Admin)
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fsS https://amardhaka.io/healthz
          curl -fsS -o /dev/null -w '%{http_code}\n' https://amardhaka.io/cloudnex-connect/admin/test | grep -E '^(200|302|401)$'
